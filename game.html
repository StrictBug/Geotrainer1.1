<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geotrainer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="game-page">
    <div class="game-shell">
        <header class="app-header">
            <div class="title-row">
                <h1>Geotrainer</h1>
            </div>
        </header>

        <div class="game-hud">
            <div class="game-hud-main">
                <p id="location">Guess the location!</p>
                <div class="game-meta" id="round-timer">
                    <span id="round">Round: 1/15</span>
                    <span id="timer">Time left: 15s</span>
                </div>
            </div>
            <div class="game-actions">
                <button id="newGame">New Round</button>
                <button id="guess" disabled>Guess</button>
                <button id="mainMenuGame" class="btn-secondary" type="button">Main Menu</button>
            </div>
        </div>

        <div id="result"></div>

        <div class="map-stage">
            <div id="map"></div>
        </div>

        <div id="quitConfirm" class="quit-confirm hidden" role="dialog" aria-modal="true" aria-labelledby="quitConfirmTitle">
            <div class="dialog-content quit-confirm-dialog">
                <h2 id="quitConfirmTitle">Leave game?</h2>
                <p>Are you sure you want to quit and return to the main menu?</p>
                <div class="button-container">
                    <button id="quitConfirmYes" type="button">Yes, quit</button>
                    <button id="quitConfirmNo" class="btn-secondary" type="button">Cancel</button>
                </div>
            </div>
        </div>

        <div id="gameOver" class="game-over hidden">
            <div class="dialog-content">
                <div id="roundSummary"></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
